# starter_v2 — Tool Declarations (English specifications for precise LLM tool routing)

tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >
      Ask the user a question to request missing required information OR to request explicit user confirmation
      before performing an external/sensitive action (such as sending a message via `send`).
      MUST use response_type="text" when asking for missing parameters (e.g. missing screenname or missing URL).
      MUST use response_type="yes_no" when asking for user confirmation before executing any send/publish request.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Clarification question or confirmation prompt for the user."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Response type: 'text' for missing info, 'yes_no' for action confirmation."}
        options: {type: array, default: [], items: {type: string}, description: "List of options if response_type is 'choice'."}
      required: [question]

  - name: timeline
    description: >
      Retrieve recent posts/tweets from a single specific social media account using their official screenname handle (e.g. sama, elonmusk, karpathy).
      Requires an explicit, known screenname. If the user does not specify whose tweets to retrieve, call `clarify(response_type="text")` to ask for the account handle.
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Official account handle (e.g., sama, elonmusk). Must not be empty or guessed."}
        limit: {type: integer, default: 5, description: "Maximum number of recent posts to retrieve."}
      required: [screenname]

  - name: social_search
    description: >
      Search public social media posts (e.g., Twitter/X) by keyword query.
      Use this when the user wants to search topic discussions on social media, or when asked to search both web AND social media (call both `lookup` and `social_search`).
      Keep the query exact and concise to the core subject without adding filler words.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search keyword query. Keep to the core subject."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Search sort type."}
        limit: {type: integer, default: 5, description: "Maximum number of items to return."}
      required: [query]

  - name: lookup
    description: >
      Search web or news articles on the internet (not social media).
      CRITICAL: Use the exact core subject keyword as `query`. Do NOT expand or add filler words (e.g. for "Tin tức AI hôm nay có gì nổi bật?", query must be "AI", topic="news", timeframe="day").
      Preserve multi-turn timeframe context across turns unless the user explicitly specifies a new timeframe.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Exact core subject search query without filler words."}
        topic: {type: string, enum: [general, news], default: "general", description: "Search category topic."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Time filter frame."}
        max_results: {type: integer, default: 5, description: "Maximum results to return."}
      required: [query]

  - name: fetch
    description: >
      Fetch full page content from a specific, real URL provided by the user or from previous search results.
      NEVER guess or invent URLs. If the user asks to summarize "this article" without providing a URL, call `clarify(response_type="text")` to ask for the URL.
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Target URL to fetch. Must be a real URL provided by the user."}
      required: [url]

  - name: format
    description: "Format retrieved research items into structured markdown text templates."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "List of research items to format."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Formatting template style."}
        headline: {type: string, default: "", description: "Optional title headline."}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >
      Send text message to an external destination (e.g. Telegram).
      Irreversible action that REQUIRES prior user confirmation via `clarify(response_type="yes_no")`.
      Only call `send` with confirmed=true AFTER the user explicitly confirms "yes".
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Message content to send."}
        confirmed: {type: boolean, default: false, description: "Must be true only after user confirmation via yes_no clarify."}
      required: [text]

  - name: policy
    description: "Search internal enterprise policy documents."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Policy domain area."}
        top_k: {type: integer, default: 3, description: "Number of policy matches."}
      required: [query]

  - name: papers
    description: "Search scientific research papers on arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query."}
        max_results: {type: integer, default: 5, description: "Max results."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort criteria."}
      required: [query]

  - name: paper_text
    description: "Extract text content from an arXiv research paper PDF."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID or URL."}
        max_pages: {type: integer, default: 5, description: "Max pages."}
        max_chars: {type: integer, default: 8000, description: "Max characters."}
      required: [arxiv_url]