# starter_v1 — tool declarations (đã làm rõ routing rules, missing-info handling,
# confirmation boundary, và arg conventions để agent route đúng trên eval).
#
# Nếu rename tool, đồng bộ tên tool trong: tools/__init__.py (TOOL_FUNCTIONS) ->
# data/eval_base.json + data/eval_research_extension.json -> system_prompt.md -> TOOL.md
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: Gửi một câu hỏi cho người dùng để xin thông tin còn thiếu HOẶC xin xác nhận
      trước khi thực hiện một hành động nhạy cảm (ví dụ: gửi tin nhắn ra bên ngoài).
      BẮT BUỘC dùng tool này (thay vì tự suy đoán, dùng giá trị mặc định, hoặc tự
      bịa dữ liệu) trong các trường hợp:
        1) Thiếu tham số bắt buộc mà không có cách suy ra hợp lý từ hội thoại
           (ví dụ: người dùng nói "tóm tắt tweet mới nhất" nhưng chưa nói xem
           tweet của tài khoản nào -> phải hỏi username trước khi gọi timeline;
           người dùng nói "tóm tắt bài viết này" nhưng không đưa link -> phải hỏi
           link trước khi gọi fetch, TUYỆT ĐỐI không tự đoán/bịa URL).
        2) Trước khi gọi tool `send` (gửi tin nhắn/nội dung ra ngoài hệ thống,
           ví dụ Telegram) -> dùng response_type="yes_no" để hỏi "Có/Không" xác
           nhận nội dung, CHỈ gọi `send` với confirmed=true sau khi người dùng
           xác nhận đồng ý.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: >
      Lấy các bài đăng gần đây của MỘT tài khoản mạng xã hội cụ thể.
      Chỉ gọi tool này khi đã biết rõ screenname (do người dùng cung cấp trong
      hội thoại). Nếu người dùng chưa cho biết muốn xem tweet/bài đăng của ai,
      KHÔNG được gọi timeline với screenname rỗng hoặc đoán bừa — phải gọi
      `clarify` để hỏi tên tài khoản trước.
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản (bắt buộc phải có giá trị thật, không để trống/đoán)"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: Tìm kiếm bài đăng công khai trên mạng xã hội (ví dụ Twitter/X) theo từ khóa.
      Dùng tool này khi người dùng muốn tìm thông tin/tin tức TRÊN mạng xã hội,
      hoặc khi người dùng yêu cầu tìm trên "cả web lẫn Twitter/mạng xã hội" —
      trường hợp này phải gọi CẢ social_search (hoặc timeline nếu có tài khoản
      cụ thể) VÀ lookup (cho web) trong cùng một lượt trả lời, không được chỉ
      gọi một trong hai. Giữ nguyên từ khóa người dùng cung cấp, không tự ý
      diễn giải/mở rộng thêm từ đồng nghĩa.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa — giữ nguyên như người dùng nêu, không tự thêm/dịch từ"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: internet_lookup
    description: Tra cứu thông tin/tin tức trên internet (web search, không phải mạng xã hội).
      Dùng khi người dùng hỏi tin tức chung hoặc tìm thông tin trên "web".
      QUAN TRỌNG - giữ nguyên query: KHÔNG tự ý mở rộng, dịch, hoặc thêm từ đồng
      nghĩa vào từ khóa người dùng cung cấp (ví dụ: người dùng nói "AI" thì
      query phải là "AI", KHÔNG tự sửa thành "AI artificial intelligence").
      Nếu người dùng yêu cầu tìm trên nhiều nguồn (web + mạng xã hội), tool này
      chỉ đáp ứng phần "web" — phải gọi thêm social_search/timeline cho phần
      mạng xã hội trong cùng lượt trả lời.
      Tham số timeframe: nếu người dùng đã nêu rõ khung thời gian ở lượt hội
      thoại trước và không nói gì khác ở lượt hiện tại, GIỮ NGUYÊN timeframe đó
      (kế thừa ngữ cảnh multi-turn); chỉ đổi khi người dùng nêu khung thời gian
      mới một cách rõ ràng.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn — giữ nguyên nguyên văn từ khóa người dùng, không tự thêm/dịch"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian — kế thừa từ lượt trước nếu người dùng không đổi"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch_URL
    description: >
      Lấy nội dung từ một địa chỉ URL CỤ THỂ mà người dùng đã cung cấp (hoặc lấy
      được từ kết quả lookup/social_search trước đó). TUYỆT ĐỐI KHÔNG tự bịa,
      đoán, hoặc dùng URL mặc định (ví dụ không tự chọn https://vnexpress.net)
      khi người dùng chỉ nói "bài viết này" mà không đưa link. Trường hợp đó
      phải gọi `clarify` để xin link trước.
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ — chỉ dùng URL có thật do người dùng cung cấp hoặc lấy từ kết quả tool trước, không tự đoán"}
      required: [url]

  - name: format_text
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: Gửi một đoạn văn bản ra bên ngoài hệ thống (ví dụ Telegram). Đây là hành
      động KHÔNG THỂ HOÀN TÁC và tác động ra bên ngoài, nên BẮT BUỘC phải xin
      xác nhận người dùng trước: gọi `clarify` với response_type="yes_no" để
      hỏi "Bạn có muốn gửi nội dung này không?" và chỉ gọi `send` với
      confirmed=true SAU KHI người dùng xác nhận "Có". TUYỆT ĐỐI không gọi
      send trực tiếp ngay khi nhận yêu cầu, kể cả khi người dùng đã nêu rõ nội
      dung cần gửi.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Chỉ true sau khi đã xác nhận Có/Không qua clarify"}
      required: [text]

  - name: policy_search
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers_search
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]